# Python CI with the same rules: tests on every push (cached dependencies), slow tests on "[smoke]" / manual runs,
# a release only from a "[release]" commit, notes from CHANGELOG.md. Replace the CHANGE-ME values.
name: Build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # uv: fast installs with its own cache keyed on the lockfile. (pip instead: actions/setup-python with cache: pip.)
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Read version
        id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Release or only test
        id: release
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MESSAGE" | grep -qF '[release]'; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the changelog has this version
        if: steps.release.outputs.release == 'true'
        run: python3 ci/release_notes.py "${{ steps.version.outputs.version }}" > /dev/null

      - run: uv sync --frozen
      - name: Fast tests
        run: uv run pytest -q -m "not slow"
      - name: Slow tests ([smoke] or a release)
        if: contains(github.event.head_commit.message, '[smoke]') || steps.release.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: uv run pytest -q -m slow

  release:
    name: Publish release
    needs: test
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: python3 ci/release_notes.py "${{ needs.test.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: notes.md
          make_latest: true
