name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release from this build
        type: boolean
        default: false

# A push only builds, runs the unit tests and the emulator test. It publishes a release only when the
# message of the pushed (head) commit contains "[release]"; a manual run publishes one when asked to.
# The release notes are that version's section of CHANGELOG.md, which must exist (checked first).

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: echo "version=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Release or only build
        id: release
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          ASKED: ${{ inputs.release }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release="${ASKED:-false}"
          elif printf '%s' "$MESSAGE" | grep -qF '[release]'; then
            release=true
          else
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Publishes a release: $release"

      - name: Check the changelog has this version
        if: steps.release.outputs.release == 'true'
        run: python3 ci/release_notes.py "${{ steps.version.outputs.version }}" > /dev/null

      # The app shows "What's new" after an update from its own copy of the changelog.
      - name: Bundle the changelog in the app
        run: mkdir -p app/src/main/assets && cp CHANGELOG.md app/src/main/assets/CHANGELOG.md

      - name: Unit tests and release APK
        run: >
          ./gradlew --quiet --console=plain --continue
          testDebugUnitTest :app:assembleRelease
          -PversionCode=${{ github.run_number }}

      - name: Summarise failed unit tests
        if: failure()
        run: python3 ci/test_failures.py

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
            "out/LiquidLauncher-${{ steps.version.outputs.version }}-build${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  smoke:
    name: Emulator test (redirect against AOSP launcher)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install screenshot helper
        run: python3 -m pip install --quiet --user pillow || true

      - name: Run on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: out/smoke/
          retention-days: 14

  release:
    name: Publish release
    needs: [build, smoke]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Release notes from CHANGELOG.md
        run: |
          python3 ci/release_notes.py "${{ needs.build.outputs.version }}" > notes.md
          printf '\n---\nBuild %s from `%s`. Install the APK below: it installs over the previous build and keeps everything.\n' \
            "${{ github.run_number }}" "${{ github.sha }}" >> notes.md
          cat notes.md

      # One APK per release: remove the previous build's file before adding the new one.
      - name: Remove older APKs from this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r name; do
                gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes || true
              done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Liquid Launcher ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          body_path: notes.md
          make_latest: true
